<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#E63946" />
    <meta name="description" content="Grand Aceh Kuliner POS — Hybrid F&B + Retail" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Work+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
    <title>Grand Aceh Kuliner POS</title>
    <style>
      /* Instant First Paint & App Shell Placeholder */
      #gak-init-loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #FBFBFB;
        color: #18181B;
        font-family: 'Manrope', system-ui, -apple-system, sans-serif;
        z-index: 999;
      }
      .gak-spinner-ring {
        width: 36px;
        height: 36px;
        border: 3.5px solid #F4F5F7;
        border-top-color: #E63946;
        border-radius: 50%;
        animation: gak-spin 0.75s linear infinite;
        margin-bottom: 16px;
      }
      @keyframes gak-spin {
        to { transform: rotate(360deg); }
      }
    </style>
    <!-- Overlay error: kalau ada error saat app dimuat (mis. WebView terlalu tua),
         tampilkan pesan di layar + tombol Salin & Kirim ke Google AI Studio (tanpa React).
         ES5 murni (var/function/XMLHttpRequest) supaya jalan di WebView paling tua. -->
    <script>
      (function () {
        var lastError = "";
        function escHtml(s) {
          return String(s || "").replace(/[&<>"']/g, function (c) {
            return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
          });
        }
        function setStatus(t) {
          var s = document.getElementById("gak-err-status");
          if (s) s.textContent = " " + t;
        }
        function copyText(t) {
          try {
            var ta = document.createElement("textarea");
            ta.value = t; ta.style.position = "fixed"; ta.style.opacity = "0";
            document.body.appendChild(ta); ta.select();
            document.execCommand("copy");
            document.body.removeChild(ta);
          } catch (e) {}
        }
        function sendError() {
          setStatus("Mengirim...");
          var report = "=== ERROR OVERLAY Grand Aceh Kuliner POS ===\n"
            + "Waktu: " + new Date().toLocaleString("id-ID") + "\n"
            + "Pesan: " + lastError + "\n"
            + "URL: " + window.location.href + "\n"
            + "UA: " + navigator.userAgent;
          var body = JSON.stringify({ ts: new Date().toISOString(), report: report });
          var xhr = new XMLHttpRequest();
          xhr.open("POST", (window.location && window.location.origin ? window.location.origin : "") + "/api/rpt", true);
          xhr.setRequestHeader("Content-Type", "application/json");
          xhr.setRequestHeader("X-Gak-Token", "gak_rpt_7f3c9e1b");
          xhr.onreadystatechange = function () {
            if (xhr.readyState === 4) {
              if (xhr.status === 200) setStatus("Terkirim ✓");
              else setStatus("Gagal (HTTP " + xhr.status + ")");
            }
          };
          xhr.onerror = function () { setStatus("Gagal (jaringan)"); };
          xhr.send(body);
        }
        function show(msg, extra) {
          lastError = msg + (extra ? "\n" + extra : "");
          var d = document.getElementById("gak-error-overlay");
          if (!d) {
            d = document.createElement("div");
            d.id = "gak-error-overlay";
            d.style.cssText = "position:fixed;inset:0;z-index:99999;background:#FEF2F2;color:#B91C1C;font:14px/1.5 system-ui,sans-serif;padding:24px;overflow:auto;white-space:pre-wrap";
            document.body.appendChild(d);
          }
          var btn = "padding:10px 16px;border:0;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;margin-right:8px";
          d.innerHTML = "<div style='font-size:18px;font-weight:700;margin-bottom:10px'>Terjadi kesalahan saat memuat aplikasi</div>"
            + "<div style='margin-bottom:14px'>" + escHtml(lastError) + "</div>"
            + "<button id='gak-err-copy' style='" + btn + "background:#fff;color:#B91C1C;border:1px solid #B91C1C'>Salin Pesan</button>"
            + "<button id='gak-err-send' style='" + btn + "background:#4F46E5;color:#fff'>Kirim ke Google AI Studio</button>"
            + "<span id='gak-err-status' style='font-size:13px'></span>";
          var copyBtn = document.getElementById("gak-err-copy");
          if (copyBtn) copyBtn.onclick = function () {
            copyText(lastError + "\n\nUA: " + navigator.userAgent + "\nURL: " + window.location.href);
            setStatus("Disalin ✓ (tempel ke chat)");
          };
          var sendBtn = document.getElementById("gak-err-send");
          if (sendBtn) sendBtn.onclick = sendError;
        }
        window.addEventListener("error", function (e) {
          show((e && e.message) || "Unknown error", (e && e.filename) ? (e.filename + ":" + e.lineno) : "");
        });
        window.addEventListener("unhandledrejection", function (e) {
          var r = e && e.reason; var m = "";
          try { m = (r && r.message) || String(r); } catch (x) {}
          // Kegagalan HTTP/jaringan (mis. 502 server sesaat, timeout, offline) JANGAN
          // menampilkan overlay penuh — halaman tetap bisa dipakai & request lain jalan.
          if (!m || /Request failed with status code|Network Error|timeout of|Failed to fetch|Load failed|ERR_/i.test(m)) {
            return;
          }
          show("Promise rejected: " + m, "");
        });
      })();
    </script>
    <script src="/polyfills.js"></script>
    <link rel="stylesheet" href="/static/css/main.4b8e83fb.css" />
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="gak-init-loader">
      <div class="gak-spinner-ring"></div>
      <div style="font-weight: 800; font-size: 15px; letter-spacing: -0.02em; color: #18181B;">Grand Aceh Kuliner POS</div>
      <div style="font-size: 11px; color: #71717A; margin-top: 4px; font-weight: 500;">Memuat sistem kasir cepat...</div>
    </div>
    <div id="root"></div>

    <script>
      (function() {
        function dismissLoader() {
          var el = document.getElementById('gak-init-loader');
          if (el) {
            el.style.transition = 'opacity 0.25s ease-out';
            el.style.opacity = '0';
            el.style.pointerEvents = 'none';
            setTimeout(function() {
              if (el && el.parentNode) el.parentNode.removeChild(el);
            }, 300);
          }
        }
        var checkTimer = setInterval(function() {
          var r = document.getElementById('root');
          if (r && r.children && r.children.length > 0) {
            dismissLoader();
            clearInterval(checkTimer);
          }
        }, 50);
        setTimeout(function() {
          clearInterval(checkTimer);
          dismissLoader();
        }, 3000);
      })();
    </script>
    <script defer="defer" src="/static/js/main.91b54d0b.js"></script>
  </body>
</html>
