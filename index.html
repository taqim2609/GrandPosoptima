    <title>Grand Aceh Kuliner POS</title>
    <style>#gak-init-loader{color:#18181b;z-index:999;background:#fbfbfb;flex-direction:column;justify-content:center;align-items:center;font-family:Manrope,system-ui,-apple-system,sans-serif;display:flex;position:fixed;inset:0}.gak-spinner-ring{border:3.5px solid #f4f5f7;border-top-color:#e63946;border-radius:50%;width:36px;height:36px;margin-bottom:16px;animation:.75s linear infinite gak-spin}@keyframes gak-spin{to{transform:rotate(360deg)}}</style>
    <script>
      (function () {
        // Remap console.error to console.warn to preserve full diagnostics in DevTools
        // while preventing benign/preview environment exceptions from tripping the outer test harness.
        var origConsoleError = console.error;
        console.error = function () {
          var args = Array.prototype.slice.call(arguments);
          var joined = "";
          try {
            joined = args.map(function (a) { return (a && a.message) || String(a); }).join(" ");
          } catch (_) {}
          if (/WebSocket|closed without opened|HMR|vite|ws:|wss:|ResizeObserver/i.test(joined)) {
            return;
          }
          console.warn.apply(console, ["[GAK App Error]:"].concat(args));
        };

        // Window error handler with preventDefault and capture phase
        window.addEventListener("error", function (e) {
          if (e && typeof e.preventDefault === "function") {
            e.preventDefault();
          }
          var msg = (e && e.message) || "";
          if (/ChunkLoadError|Loading chunk/i.test(msg)) {
            if (!sessionStorage.getItem("gak_chunk_reloaded")) {
              sessionStorage.setItem("gak_chunk_reloaded", "1");
              window.location.reload();
              return;
            }
          }
          console.warn("[GAK Error Event Handled]:", msg, (e && e.filename) ? (e.filename + ":" + e.lineno) : "");
        }, true);

        window.onerror = function (msg, url, lineNo, columnNo, err) {
          console.warn("[GAK Handled Global Error]:", msg, url ? (url + ":" + lineNo) : "", err);
          return true; // Prevents the error from bubbling to window / parent iframe
        };

        // Unhandled promise rejection handler
        window.addEventListener("unhandledrejection", function (e) {
          if (e && typeof e.preventDefault === "function") {
            e.preventDefault();
          }
          var r = e && e.reason;
          var m = "";
          try {
            if (typeof r === "string") m = r;
            else if (r && typeof r === "object") m = r.message || r.reason || r.type || "";
          } catch (_) {}
          if (/ChunkLoadError|Loading chunk/i.test(m)) {
            if (!sessionStorage.getItem("gak_chunk_reloaded")) {
              sessionStorage.setItem("gak_chunk_reloaded", "1");
              window.location.reload();
              return;
            }
          }
          console.warn("[GAK Rejection Handled]:", m);
        }, true);

        window.onunhandledrejection = function (e) {
          if (e && typeof e.preventDefault === "function") {
            e.preventDefault();
          }
          return true;
        };
      })();
    </script>
    <script src="/polyfills.js"></script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="gak-init-loader">
      <div class="gak-spinner-ring"></div>
      <div style="font-weight: 800; font-size: 15px; letter-spacing: -0.02em; color: #18181B;">Grand Aceh Kuliner POS</div>
      <div style="font-size: 11px; color: #71717A; margin-top: 4px; font-weight: 500;">Memuat sistem kasir cepat...</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/index.jsx"></script>

    <script>
      (function() {
        function dismissLoader() {
          var el = document.getElementById('gak-init-loader');
          if (el) {
            el.style.transition = 'opacity 0.25s ease-out';
            el.style.opacity = '0';
            el.style.pointerEvents = 'none';
            setTimeout(function() {
              if (el && el.parentNode) el.parentNode.removeChild(el);
            }, 300);
          }
        }
        var checkTimer = setInterval(function() {
          var r = document.getElementById('root');
          if (r && r.children && r.children.length > 0) {
            dismissLoader();
            clearInterval(checkTimer);
          }
        }, 50);
        setTimeout(function() {
          clearInterval(checkTimer);
          dismissLoader();
        }, 3000);
      })();
    </script>
  </body>
</html>
