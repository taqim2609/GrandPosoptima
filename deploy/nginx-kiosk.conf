# nginx config as served by project-frontend-1 on the kiosk Pi (kasir-pi / 100.109.98.56).
# Captured from the running container because it existed nowhere in the repo.
# Repo copy at project/frontend/nginx.conf proxies /api to backend:8001 and is NOT this file;
# deploying that one would break the kiosk API proxy.
# Deploy: docker cp this file into the container at /etc/nginx/conf.d/default.conf, then reload.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 25m;

    # CORS — dipakai lokasi yang TIDAK punya add_header sendiri.
    # CATATAN: nginx TIDAK mewariskan add_header dari server ke lokasi yang
    # mendefinisikan add_header sendiri, jadi tiap lokasi penting (/ota/, /static/,
    # /index.html) menyertakan header CORS secara eksplisit.
    add_header Access-Control-Allow-Origin * always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Gak-Token" always;
    # Private Network Access: wajib agar WebView APK (origin http://localhost)
    # bisa memanggil IP privat (LAN 192.168.x / tailnet 100.x). Tanpa header ini
    # Chrome/WebView memblokir -> "Failed to fetch".
    add_header Access-Control-Allow-Private-Network true always;

    # Kompresi -> hemat bandwidth & meringankan transfer server Pi
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml font/ttf font/woff font/woff2;

    # ------------------------------------------------------------------
    # MODE KIOSK: Raspberry Pi adalah mesin kasir, bukan etalase publik.
    # Buka http://<ip-pi>/ -> langsung ke antarmuka kasir (/pos).
    #
    # Landing redirect (return 302 /pos) DIHAPUS: landing publik kini disajikan
    # oleh nginx Gudang (VPS). Root / di Pi melayani SPA POS via try_files.
    # ------------------------------------------------------------------

    # API proxy untuk landing page config -> Gudang:8000 (P1B landing API)
    #
    # Catatan: nama host gudang-644.tailf3a839.ts.net dalam container Pi hanya
    # me-resolve ke IPv6 (2403:2500:400:20::e8e) dan tidak terjangkau (container
    # tidak punya path IPv6), sehingga proxy ke hostname ini gagal (HTTP 000).
    # Upstream IPv4 tailnet Gudang (100.117.186.13:8000) diverifikasi HTTP 200.
    location /api/landing/ {
        proxy_pass http://100.117.186.13:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        add_header Access-Control-Allow-Private-Network true always;
    }

    # API proxy ke backend (Gudang nginx port 80 mengarahkan /api/* ke P1A:8001).
    # Catatan: tidak ada container 'backend' di Pi; upstreams API Gudang diakses
    # lewat VPS IP. Sama persis dengan config live yang sudah berjalan.
    location /api/ {
        proxy_pass http://100.117.186.13;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        add_header Access-Control-Allow-Private-Network true always;
    }

    # Aset ber-hash (CRA /static/*) -> cache permanen "immutable".
    location /static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Gak-Token" always;
        add_header Access-Control-Allow-Private-Network true always;
        access_log off;
        try_files $uri =404;
    }

    # Bundle OTA -> jangan di-cache + WAJIB CORS (dipakai APK cross-origin).
    location /ota/ {
        add_header Cache-Control "no-store";
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Gak-Token" always;
        add_header Access-Control-Allow-Private-Network true always;
        # Preflight OPTIONS (browser/WebView) -> jawab langsung 204
        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    # index.html -> selalu revalidate agar update selalu masuk (tidak nyangkut versi lama).
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Gak-Token" always;
        add_header Access-Control-Allow-Private-Network true always;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
