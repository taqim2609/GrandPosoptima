<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#E63946" />
    <meta name="description" content="Sistem POS hybrid F&B dan Retail untuk restoran Grand Aceh Kuliner dengan manajemen meja, produk, shift, kasir, dan laporan." />
    <meta property="og:title" content="Grand Aceh Kuliner POS" />
    <meta property="og:description" content="Sistem POS hybrid F&B dan Retail untuk restoran Grand Aceh Kuliner dengan manajemen meja, produk, shift, kasir, dan laporan." />
    <meta property="og:type" content="website" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="GrandPOS" />
    <meta name="application-name" content="Grand Aceh Kuliner POS" />
    <meta name="msapplication-TileColor" content="#E63946" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Work+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
    <title>Grand Aceh Kuliner POS</title>
    <style>
      /* Instant First Paint & App Shell Placeholder */
      #gak-init-loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #FBFBFB;
        color: #18181B;
        font-family: 'Manrope', system-ui, -apple-system, sans-serif;
        z-index: 999;
      }
      .gak-spinner-ring {
        width: 36px;
        height: 36px;
        border: 3.5px solid #F4F5F7;
        border-top-color: #E63946;
        border-radius: 50%;
        animation: gak-spin 0.75s linear infinite;
        margin-bottom: 16px;
      }
      @keyframes gak-spin {
        to { transform: rotate(360deg); }
      }
    </style>
    <script>
      (function () {
        // Chunk reload recovery & graceful error logging (tanpa blocking UI overlay)
        window.addEventListener("error", function (e) {
          var msg = (e && e.message) || "";
          if (!msg || /WebSocket|closed without opened|HMR|vite|ws:|wss:|ResizeObserver/i.test(msg)) {
            return;
          }
          if (/ChunkLoadError|Loading chunk/i.test(msg)) {
            if (!sessionStorage.getItem("gak_chunk_reloaded")) {
              sessionStorage.setItem("gak_chunk_reloaded", "1");
              window.location.reload();
              return;
            }
          }
          console.warn("[GAK Error Event]:", msg, (e && e.filename) ? (e.filename + ":" + e.lineno) : "");
        });
        window.addEventListener("unhandledrejection", function (e) {
          var r = e && e.reason; var m = "";
          try {
            if (typeof r === "string") {
              m = r;
            } else if (r && typeof r === "object") {
              m = r.message || r.reason || r.type || "";
            }
          } catch (x) {}
          if (!m || m === "Error") return;
          if (/ChunkLoadError|Loading chunk/i.test(m)) {
            if (!sessionStorage.getItem("gak_chunk_reloaded")) {
              sessionStorage.setItem("gak_chunk_reloaded", "1");
              window.location.reload();
              return;
            }
          }
          if (/Request failed|Network Error|timeout|Failed to fetch|Load failed|WebSocket|closed without opened|ws:|wss:|vite|HMR|CloseEvent|AbortError/i.test(m)) {
            return;
          }
          console.warn("[GAK Unhandled Rejection]:", m);
        });
      })();
    </script>
    <script src="%PUBLIC_URL%/polyfills.js"></script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="gak-init-loader">
      <div class="gak-spinner-ring"></div>
      <div style="font-weight: 800; font-size: 15px; letter-spacing: -0.02em; color: #18181B;">Grand Aceh Kuliner POS</div>
      <div style="font-size: 11px; color: #71717A; margin-top: 4px; font-weight: 500;">Memuat sistem kasir cepat...</div>
    </div>
    <div id="root"></div>

    <script>
      (function() {
        function dismissLoader() {
          var el = document.getElementById('gak-init-loader');
          if (el) {
            el.style.transition = 'opacity 0.25s ease-out';
            el.style.opacity = '0';
            el.style.pointerEvents = 'none';
            setTimeout(function() {
              if (el && el.parentNode) el.parentNode.removeChild(el);
            }, 300);
          }
        }
        var checkTimer = setInterval(function() {
          var r = document.getElementById('root');
          if (r && r.children && r.children.length > 0) {
            dismissLoader();
            clearInterval(checkTimer);
          }
        }, 50);
        setTimeout(function() {
          clearInterval(checkTimer);
          dismissLoader();
        }, 3000);
      })();
    </script>
  </body>
</html>
