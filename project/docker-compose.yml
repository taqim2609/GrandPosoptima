# Grand Aceh Kuliner POS — Server Lokal (PC Server & Raspberry Pi)
# Menjalankan: Mongo DB + Backend API + Frontend Web
# Jalankan di PC Server/gudang-644: docker compose up -d --build
# Jalankan di Pi (cadangan):      docker compose up -d --build
#
# WhatsApp TIDAK jalan di sini. Sesi WhatsApp dipegang gateway Hermes yang hanya
# hidup di server gudang-644 (lihat `docker-compose.gudang.yml`; alasan lengkap di
# `docs/PANDUAN-WHATSAPP-HERMES.md`). Pi tidak mengirim/menerima WA.

services:
  mongo:
    # Satu sumber kebenaran: MongoDB 4.4.18 (baseline produksi Raspberry Pi).
    # Bisa ditimpa lewat MONGO_IMAGE, tetapi nilai bawaan harus sama dengan Pi
    # agar backup/dump dari satu node pasti bisa di-restore di node lain.
    image: ${MONGO_IMAGE:-mongo:4.4.18}
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    networks:
      - pos_network

  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env.docker
    environment:
      - HOST_PROJECT_DIR=${HOST_PROJECT_DIR:-}
      - UPDATER_IMAGE=${UPDATER_IMAGE:-docker:cli}
      - UVICORN_WORKERS=${UVICORN_WORKERS:-2}
      - GOOGLE_CLOUD_SYNC_URL=${GOOGLE_CLOUD_SYNC_URL:-https://ais-pre-pweobuimlhj7oohblibyuh-754954417035.asia-southeast1.run.app}
      # Identitas node: 644 = primary (pengirim WA), Pi = backup (tidak kirim WA).
      # Variabel di bawah diisi dari project/.env (compose), BUKAN dari
      # backend/.env.docker — nilai `environment` menang atas `env_file`.
      # Default peran sengaja "backup": node baru tidak mengirim WA sampai
      # dinyatakan primary secara eksplisit. Lihat .env.gudang.example.
      - NODE_ID=${NODE_ID:-}
      - NODE_ROLE=${NODE_ROLE:-backup}
      # Integrasi Hermes hanya diisi di 644 (lihat .env.gudang.example).
      # Di Pi dibiarkan KOSONG.
      - HERMES_WA_WEBHOOK_URL=${HERMES_WA_WEBHOOK_URL:-}
      - HERMES_WA_WEBHOOK_SECRET=${HERMES_WA_WEBHOOK_SECRET:-}
      - HERMES_WA_ENABLED=${HERMES_WA_ENABLED:-1}
      - HERMES_WA_TIMEOUT=${HERMES_WA_TIMEOUT:-20}
      # Secret webhook pesan masuk (dipakai plugin Hermes saat memanggil POS).
      - WA_WEBHOOK_SECRET=${WA_WEBHOOK_SECRET:-}
      - HERMES_CMD_ALLOWLIST=${HERMES_CMD_ALLOWLIST:-}
    depends_on:
      - mongo
    volumes:
      - uploads_data:/app/uploads
      - /var/run/docker.sock:/var/run/docker.sock
      - ${HOST_PROJECT_DIR:-.}:/host-project:ro
    networks:
      - pos_network

  frontend:
    build:
      context: ./frontend
      args:
        REACT_APP_BACKEND_URL: ""
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - pos_network

networks:
  pos_network:
    driver: bridge

volumes:
  mongo_data:
  uploads_data:
