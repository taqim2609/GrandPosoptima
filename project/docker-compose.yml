# Grand Aceh Kuliner POS — Server Lokal (PC Server & Raspberry Pi)
# Menjalankan: Mongo DB + Backend API + Frontend Web + Evolution API (WhatsApp Gateway)
# Jalankan di PC Server: docker compose up -d --build
# Jalankan di Pi:        docker compose up -d --build

services:
  mongo:
    # PC Server (x86_64) -> mongo:7 (default berkecepatan tinggi)
    # Raspberry Pi 3/4 (ARMv8.0) -> MONGO_IMAGE=mongo:4.4.18 di .env
    image: ${MONGO_IMAGE:-mongo:7}
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    networks:
      - pos_network

  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env.docker
    environment:
      - HOST_PROJECT_DIR=${HOST_PROJECT_DIR:-}
      - UPDATER_IMAGE=${UPDATER_IMAGE:-docker:cli}
      - UVICORN_WORKERS=${UVICORN_WORKERS:-2}
      - GOOGLE_CLOUD_SYNC_URL=${GOOGLE_CLOUD_SYNC_URL:-https://ais-pre-pweobuimlhj7oohblibyuh-754954417035.asia-southeast1.run.app}
      - EVOLUTION_API_URL=${EVOLUTION_API_URL:-http://evolution-api:8080}
      - EVOLUTION_API_KEY=${EVOLUTION_API_KEY:-grandpos_evolution_secret_2026}
    depends_on:
      - mongo
    volumes:
      - uploads_data:/app/uploads
      - /var/run/docker.sock:/var/run/docker.sock
      - ${HOST_PROJECT_DIR:-.}:/host-project:ro
    networks:
      - pos_network

  evolution-api:
    image: atendai/evolution-api:v2.1.2
    container_name: grandpos_evolution_api
    restart: unless-stopped
    ports:
      - "${EVOLUTION_PORT:-8080}:8080"
    environment:
      - SERVER_URL=http://localhost:${EVOLUTION_PORT:-8080}
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY:-grandpos_evolution_secret_2026}
      - DATABASE_PROVIDER=local
      - DATABASE_SAVE_DATA_INSTANCE=true
      - DATABASE_SAVE_DATA_NEW_MESSAGE=true
      - DATABASE_SAVE_MESSAGE_UPDATE=true
      - DATABASE_SAVE_DATA_CONTACTS=true
      - DATABASE_SAVE_DATA_CHATS=true
      - STORE_MESSAGES=true
      - STORE_MESSAGE_UP=true
      - STORE_CONTACTS=true
      - STORE_CHATS=true
      - CLEAN_STORE_CLEANING_INTERVAL=7200
      - LOG_LEVEL=INFO
    volumes:
      - evolution_instances:/evolution/instances
      - evolution_store:/evolution/store
    networks:
      - pos_network

  frontend:
    build:
      context: ./frontend
      args:
        REACT_APP_BACKEND_URL: ""
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - pos_network

networks:
  pos_network:
    driver: bridge

volumes:
  mongo_data:
  uploads_data:
  evolution_instances:
  evolution_store:
