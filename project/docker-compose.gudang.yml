# Grand Aceh Kuliner POS — override KHUSUS server gudang-644.
#
# Pemakaian di 644:
#   docker compose -f docker-compose.yml -f docker-compose.gudang.yml up -d --build
#
# Kenapa dipisah: hanya 644 yang boleh bicara WhatsApp. Pi memakai compose utama
# tanpa berkas ini, jadi Pi tidak mungkin ikut mengirim/menerima WA.
#
# Catatan desain: POS TIDAK lagi menjalankan bridge WhatsApp sendiri. Sesi
# WhatsApp (Baileys) dipegang gateway Hermes di host ini, karena Hermes tidak
# menyediakan REST kirim-pesan — arah keluar lewat webhook adapter Hermes
# (deliver_only) dan arah masuk lewat plugin `pre_gateway_dispatch`.

services:
  backend:
    ports:
      # Hanya loopback host. Dipakai plugin Hermes (proses di host yang sama)
      # untuk mengirim pesan WhatsApp masuk ke POS. Tidak terbuka ke LAN,
      # Tailnet, maupun internet — jangan ubah ke 0.0.0.0.
      - "127.0.0.1:${BACKEND_PORT:-8001}:8001"
